{% if project.bank_project_id %}{% with b=project.bank_project %}<a href="{% url 'bank_list' %}?open={{ b.id }}" class="inline-flex flex-wrap items-center gap-1 rounded-full border border-brand-200 bg-brand-50 px-2 py-0.5 text-[11px] text-brand-700" title="आयोजना बैंक"><i class="fas fa-box-archive"></i> {{ b.code }}{% if b.priority %} · {{ b.priority }}{% endif %}{% if b.sdg %} · SDG {{ b.sdg }}{% endif %}{% if b.pillar %} · {{ b.pillar.name }}{% endif %}</a>{% endwith %}{% elif project.id %}<span class="inline-flex rounded-full border border-amber-200 bg-amber-50 px-2 py-0.5 text-[11px] text-amber-700" title="{{ project.outside_bank_reason }}"><i class="fas fa-right-from-bracket mr-1"></i> आयोजना बैंक बाहिर</span>{% endif %}
